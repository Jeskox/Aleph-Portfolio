<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="cosmosBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0E1726"/>
      <stop offset="100%" stop-color="#04060A"/>
    </radialGradient>
    <linearGradient id="planetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="16" fill="url(#cosmosBg)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.5"/>
  
  <!-- Back Orbital Ring Arc -->
  <path d="M12 36 C10 30 20 23 38 21 C48 20 54 22 55 24" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="1 0" opacity="0.6"/>
  
  <!-- Central Planet Sphere -->
  <circle cx="32" cy="32" r="14" fill="url(#planetGrad)"/>
  <circle cx="28" cy="27" r="11" fill="#38BDF8" opacity="0.25"/>
  
  <!-- Front Orbital Ring Arc -->
  <path d="M55 24 C57 28 47 38 29 42 C17 44 9 41 8 38 C7 36 9 34 14 32" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Pulsar / Star Accents -->
  <circle cx="48" cy="15" r="2" fill="#F59E0B"/>
  <path d="M48 11 V19 M44 15 H52" stroke="#F59E0B" stroke-width="1" stroke-linecap="round"/>
  
  <circle cx="15" cy="50" r="1" fill="#38BDF8" opacity="0.8"/>
</svg>
